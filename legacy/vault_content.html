    <div class="oz-hero" style="text-align: left; align-items: flex-start;">
        <h1 class="oz-hero__title" style="font-size: 2rem;">Coffre-Fort Sécurisé</h1>
        <p class="oz-hero__subtitle">Documents chiffrés localement (AES-256). Aucune donnée ne quitte ce téléphone.</p>
    </div>

    <style>
      .oz-pin-container { position: relative; width: 100%; display: flex; justify-content: center; padding: 20px 0; }
      .oz-pin-dots { display: flex; gap: 20px; position: relative; }
      .oz-pin-dot { 
          width: 24px; height: 24px; border: 2px solid var(--oz-color-primary); 
          border-radius: 50%; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
          background: transparent;
      }
      .oz-pin-dot.filled { 
          background: var(--oz-color-primary);
          transform: scale(1.1);
          box-shadow: 0 0 15px var(--oz-color-primary-soft);
      }
      #vaultPinHidden {
          position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0;
          cursor: pointer; font-size: 16px; /* Prevent zoom on mobile */
      }
    </style>

    <!-- PIN SECURITY BOX -->
    <div class="oz-card oz-mt-8" style="background: var(--oz-color-primary-soft); border: 2px dashed var(--oz-color-primary); overflow: hidden;">
        <h3 class="oz-card__title" style="color: var(--oz-color-primary);">Code PIN requis</h3>
        <p class="oz-card__desc">Entre ton PIN pour accéder à tes documents.</p>
        
        <div class="oz-pin-container oz-mt-4">
            <div class="oz-pin-dots">
                <div class="oz-pin-dot" id="dot0"></div>
                <div class="oz-pin-dot" id="dot1"></div>
                <div class="oz-pin-dot" id="dot2"></div>
                <div class="oz-pin-dot" id="dot3"></div>
            </div>
            <input type="password" id="vaultPinHidden" inputmode="numeric" maxlength="4" autocomplete="off">
        </div>

        <p style="font-size: 0.7rem; color: var(--oz-color-danger); margin-top: 10px; font-weight: 700; text-align: center;"><img src="img/icons/warning.svg" alt="warning" class="oz-icon" aria-hidden="true"> Si tu perds ce code, tes documents seront DEFINITIVEMENT perdus.</p>
    </div>

    <!-- VAULT CONTENT (Hidden until unlocked) -->
    <div id="vaultContent" style="display: none;" class="oz-mt-8">
        <div class="oz-flex oz-center oz-gap-4 oz-mb-8">
            <button onclick="document.getElementById('vaultFileInput').click()" class="oz-btn oz-btn-primary oz-flex-1" style="height: 60px;">+ Ajouter un Document</button>
            <input type="file" id="vaultFileInput" style="display: none;" onchange="handleFileUpload(this)">
        </div>

        <div id="docList" class="oz-grid oz-grid-1 oz-mt-4">
            <!-- Documents dynamically listed here -->
        </div>

        <button onclick="lockVault()" class="oz-btn oz-btn-outline oz-mt-12" style="width: 100%;">🔒 Verrouiller le coffre</button>
        <button onclick="clearVault()" class="oz-btn oz-btn-danger oz-mt-4" style="width: 100%; background: none; border: 1px solid var(--oz-color-danger); color: var(--oz-color-danger);">Vider le coffre définitivement</button>
    </div>
  </div>

  <script>
    function initVault() {
        console.log("🔒 Vault Component Initialized (AES-GCM)");
        const pinInput = document.getElementById('vaultPinHidden');
        const content = document.getElementById('vaultContent');
        const docList = document.getElementById('docList');
        let currentPin = "";

        pinInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Update dots
            for(let i=0; i<4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i < val.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            }

            // Auto-unlock if 4 chars
            if (val.length === 4) {
               unlockVault(val);
            }
        });

        window.unlockVault = async (pin) => {
            if (!pin || pin.length < 4) return;
            
            // Artificial delay for feedback
            setTimeout(() => {
                currentPin = pin;
                content.style.display = 'block';
                pinInput.closest('.oz-card').style.display = 'none';
                renderDocs();
            }, 300);
        };

        window.renderDocs = () => {
            const docs = JSON.parse(localStorage.getItem('oz_vault_docs') || '[]');
            if (docs.length === 0) {
                docList.innerHTML = '<div class="oz-card oz-center" style="height: 100px; border-style: dotted;"><p style="color: var(--oz-color-text-soft);">Aucun document pour le moment.</p></div>';
                return;
            }
            
            docList.innerHTML = docs.map((d, i) => `
                <div class="oz-card oz-flex oz-center" style="justify-content: space-between; border-left: 4px solid var(--oz-color-primary);">
                    <div style="flex: 1; padding-right: 12px;">
                        <h4 style="font-weight: 700; word-break: break-all;">${d.name}</h4>
                        <p style="font-size: 0.75rem; color: var(--oz-color-text-soft);">${d.date}</p>
                    </div>
                    <div class="oz-flex oz-gap-2">
                         <button onclick="viewDoc(${i})" class="oz-btn oz-btn-primary" style="padding: 10px; min-width: 44px;">👁️</button>
                         <button onclick="deleteDoc(${i})" class="oz-btn oz-btn-outline" style="padding: 10px; color: var(--oz-color-danger); border-color: var(--oz-color-danger); min-width: 44px;">✕</button>
                    </div>
                </div>
            `).join('');
        };

        window.handleFileUpload = async (input) => {
            const file = input.files[0];
            if (!file) return;

            try {
                const btn = document.querySelector('button[onclick*="vaultFileInput"]');
                const originalText = btn.innerText;
                btn.innerText = "<img src="img/icons/wait.svg" alt="wait" class="oz-icon" aria-hidden="true"> Chiffrement...";
                btn.disabled = true;

                const encryptedBase64 = await ORIZEN_SECURITY.encryptFile(file, currentPin);
                
                const docs = JSON.parse(localStorage.getItem('oz_vault_docs') || '[]');
                docs.push({
                    name: file.name,
                    date: new Date().toLocaleString('fr-FR'),
                    data: encryptedBase64,
                    type: file.type
                });
                
                localStorage.setItem('oz_vault_docs', JSON.stringify(docs));
                renderDocs();
                
                btn.innerText = originalText;
                btn.disabled = false;
                input.value = '';
                alert("✅ Document chiffré et sauvegardé localement.");
            } catch (err) {
                console.error("Encryption error:", err);
                alert("Erreur lors du chiffrement.");
            }
        };

        window.deleteDoc = (index) => {
            if (!confirm("Supprimer ce document définitivement ?")) return;
            const docs = JSON.parse(localStorage.getItem('oz_vault_docs') || '[]');
            docs.splice(index, 1);
            localStorage.setItem('oz_vault_docs', JSON.stringify(docs));
            renderDocs();
        };

        window.viewDoc = async (index) => {
            const docs = JSON.parse(localStorage.getItem('oz_vault_docs') || '[]');
            const doc = docs[index];
            
            try {
                const decryptedBuffer = await ORIZEN_SECURITY.decryptFile(doc.data, currentPin);
                const blob = new Blob([decryptedBuffer], { type: doc.type });
                const url = URL.createObjectURL(blob);
                
                // Open in new tab or download
                const a = document.createElement('a');
                a.href = url;
                a.download = doc.name;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert("Erreur de déchiffrement. Le PIN a peut-être changé ?");
            }
        };

        window.lockVault = () => {
            currentPin = "";
            location.reload(); // Quick way to clear state in SPA for security
        };

        window.clearVault = () => {
            if (!confirm("<img src="img/icons/warning.svg" alt="warning" class="oz-icon" aria-hidden="true"> ATTENTION : Cela supprimera TOUS tes documents chiffrés. Continuer ?")) return;
            localStorage.removeItem('oz_vault_docs');
            renderDocs();
        };
    }

    if (!window.ORI_APP) initVault();
  </script>
