<!DOCTYPE html>
<html lang="fr" class="oz-neo-digital">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OriZen | Premium Social Aid</title>
    
    <!-- Design System (Neo-Digital) -->
    <link rel="stylesheet" href="css/design-system-21.css">
    <link rel="stylesheet" href="css/layout-header-footer.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/widget.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: var(--c21-bg);
            color: var(--c21-text);
            font-family: var(--c21-font-body);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* 1. LIQUID HEADER */
        .c21-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, var(--c21-bg) 0%, transparent 100%);
            backdrop-filter: blur(8px);
        }

        .c21-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-family: var(--c21-font-heading);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .c21-logo img { width: 28px; height: 28px; filter: drop-shadow(0 0 8px var(--c21-primary)); }

        /* 2. FLOATING PILL NAV */
        .c21-nav-floating {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .c1-nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--c21-text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .c1-nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .c1-nav-item:hover:not(.active) {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        /* 3. SOS & SECURITY (Neo Style) */
        .c21-sos-btn {
            background: var(--c21-danger);
            color: white;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .c21-quick-exit {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        #app-shell-content {
            padding-bottom: 120px; /* Space for floating nav */
        }
    </style>
</head>
<body class="c21-bg">

    <header class="c21-header">
        <a href="#" class="c21-logo" onclick="window.ORI_APP.navigate('home')">
            <img src="img/icons/violence.svg" alt="" aria-hidden="true">
            <span>OriZen</span>
        </a>
        <div style="display:flex; gap:12px; align-items:center;">
            <button onclick="window.toggleNightMode()" class="c21-pill" style="cursor:pointer; border:none; background:rgba(255,255,255,0.05);">🌙</button>
            <button id="quickExitBtn-header" class="c21-quick-exit">SORTIE RAPIDE</button>
            <button class="c21-sos-btn" onclick="toggleSosMenu()"><img src="img/icons/warning.svg" alt="warning" class="oz-icon" aria-hidden="true"> SOS</button>
        </div>
    </header>

    <main id="app-shell-content">
        <!-- Injected View -->
    </main>

    <!-- FLOATING NAV (21st.dev Style) -->
    <nav class="c21-nav-floating">
        <button onclick="window.ORI_APP.navigate('home')" class="c1-nav-item active" title="Accueil"><img src="img/icons/logement.svg" alt="logement" class="oz-icon" aria-hidden="true"></button>
        <button onclick="window.ORI_APP.navigate('assistant')" class="c1-nav-item" title="Assistant"><img src="img/icons/chat.svg" alt="chat" class="oz-icon" aria-hidden="true"></button>
        <button onclick="window.ORI_APP.navigate('carte')" class="c1-nav-item" title="Carte"><img src="img/icons/location.svg" alt="location" class="oz-icon" aria-hidden="true"></button>
        <button onclick="window.ORI_APP.navigate('vault')" class="c1-nav-item" title="Coffre Fort">🔒</button>
    </nav>

    <!-- SOS MENU OVERLAY -->
    <div id="sosMenu" style="display:none; position:fixed; inset:0; z-index:3000; background:rgba(2,6,23,0.9); backdrop-filter:blur(20px); padding:24px; flex-direction:column; justify-content:center; align-items:center;">
        <div class="c21-card" style="width:100%; max-width:400px; text-align:center; background:rgba(15,23,42,0.8); border:1px solid var(--c21-danger);">
            <h2 class="c21-text-gradient" style="margin-top:0;">URGENCE</h2>
            <div style="display:grid; grid-template-columns:1fr; gap:12px; margin:24px 0;">
                <a href="tel:17" class="c21-btn-primary" style="background:var(--c21-danger);"><img src="img/icons/alert.svg" alt="alert" class="oz-icon" aria-hidden="true"> Police (17)</a>
                <a href="tel:115" class="c21-btn-primary">🏨 Samu Social (115)</a>
                <a href="tel:3919" class="c21-btn-primary" style="background:transparent; border:1px solid var(--c21-primary);">💜 Violences (3919)</a>
            </div>
            <button onclick="toggleSosMenu()" class="c21-quick-exit" style="width:100%;">Fermer</button>
        </div>
    </div>

    <!-- JS DEPENDENCIES -->
    <script src="js/theme-init.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>

    <script>
        function toggleSosMenu() {
            const menu = document.getElementById('sosMenu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        }
        
        // Cache busting reload if needed
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js?v=neo8');
        }
    </script>
</body>
</html>
